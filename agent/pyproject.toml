[project]
name = "kwami-lk-agent"
version = "0.1.0"
description = "LiveKit Cloud agent for Kwami AI"
requires-python = ">=3.11"
dependencies = [
    # Upper bounds are deliberate: this agent calls framework internals and
    # provider-specific helpers, so a major bump must be an explicit, tested
    # decision rather than a silent resolution. An unpinned `zep-cloud>=3.0.0`
    # is how five now-nonexistent Zep methods stayed in the code unnoticed.
    "livekit-agents>=1.3.12,<2.0.0",
    "livekit-plugins-openai>=1.3.12,<2.0.0",
    "livekit-plugins-deepgram>=1.3.12,<2.0.0",
    "livekit-plugins-cartesia>=1.3.12,<2.0.0",
    "livekit-plugins-elevenlabs>=1.3.12,<2.0.0",
    "livekit-plugins-silero>=1.3.12,<2.0.0",
    "python-dotenv>=1.0.0",
    "zep-cloud>=3.16.0,<4.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]
elevenlabs = ["livekit-plugins-elevenlabs>=1.3.12,<2.0.0"]
google = ["livekit-plugins-google>=1.3.12,<2.0.0"]
anthropic = ["livekit-plugins-anthropic>=1.3.12,<2.0.0"]

[tool.ruff]
line-length = 100
# The floor, not the ceiling: local dev pins 3.11 (.python-version) while the
# production image builds on 3.13 (Dockerfile). CI runs both.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the livekit imports so plugins see the
# credentials at import time. Phase 3 removes this by moving credentials into
# an injected Settings object, and this exemption goes with it.
"src/main.py" = ["E402"]
# Lazily-imported SDK classes are bound to local names that are legitimately
# PascalCase (AsyncZep, ZepMessage).
"src/memory/manager.py" = ["N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` is excluded by default so the standard run is offline, free and fast.
# `make test-e2e` opts back in.
addopts = "--strict-markers --strict-config -ra -m 'not live'"
markers = [
    "live: hits real provider APIs; needs credentials and network",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratcheted upward each phase; reaches 100 in Phase 6. See the plan.
fail_under = 26
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Starts permissive and is tightened per-module as the rework lands; the point
# today is to catch the None-handling and dict-shape classes of bug.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Modules that do not type-check yet. This list only shrinks: each phase clears
# the modules it touches and deletes them from here, so the gate covers more of
# the codebase over time without ever going red in between. The remaining 23
# modules under src/ are checked today.
[[tool.mypy.overrides]]
module = [
    "src.agent",
    "src.browser.browser_session",
    "src.factories.llm",
    "src.factories.stt",
    "src.factories.tts",
    "src.handlers.config_handler",
    "src.main",
    "src.memory.context",
    "src.memory.manager",
    "src.memory.ontology",
    "src.memory.search",
    "src.session",
    "src.tools.builtin",
]
ignore_errors = true
