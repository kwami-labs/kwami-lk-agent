name: Feature request
description: Propose a change to the agent, protocol, or docs.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Link to docs/architecture.md or docs/protocol.md if you already know the layer.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Likely layer
      options:
        - domain (pure logic)
        - runtime / session
        - protocol / data channel
        - memory
        - tools
        - browser
        - billing
        - factories / providers
        - docs / DX
        - unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
