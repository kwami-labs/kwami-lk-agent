name: Security

# The project had no dependency audit, no secret scanning and no static
# analysis. The agent holds credentials for a dozen providers and drives a
# browser carrying the user's logins, so a vulnerable transitive dependency is
# not an abstract risk here.
#
# Runs on the same events as the test gate, plus a weekly cron: a CVE is
# published against a dependency that has not changed, so "on push" alone
# would never surface it.

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev

      # Audits the resolved environment, which is what actually ships in the
      # image -- not just the direct dependencies in pyproject.toml.
      - name: pip-audit
        working-directory: agent
        run: |
          uv run --with pip-audit python -m pip_audit \
            --strict \
            --progress-spinner off \
            --desc

  node-audit:
    name: Worker dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # packageManager lives in infra/package.json, not the repo root. Without
      # this the action looks at a file that does not exist and exits before
      # the audit can run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        working-directory: infra
        run: pnpm audit --audit-level moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history to scan commits rather than just the tree.
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE on organization
      # repos. The binary itself is MIT and does the same scan, so we run that
      # instead. Version and checksum are pinned together; the hash is the
      # linux_x64 line from the matching gitleaks_*_checksums.txt release asset.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256} ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads the SARIF results
    strategy:
      fail-fast: false
      matrix:
        # `python` covers agent/, `javascript-typescript` covers infra/.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:${{ matrix.language }}"
