name: Security

# The project had no dependency audit, no secret scanning and no static
# analysis. The agent holds credentials for a dozen providers and drives a
# browser carrying the user's logins, so a vulnerable transitive dependency is
# not an abstract risk here.
#
# Runs on the same events as the test gate, plus a weekly cron: a CVE is
# published against a dependency that has not changed, so "on push" alone
# would never surface it.

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev

      # Audits the resolved environment, which is what actually ships in the
      # image -- not just the direct dependencies in pyproject.toml.
      - name: pip-audit
        working-directory: agent
        run: |
          uv run --with pip-audit python -m pip_audit \
            --strict \
            --progress-spinner off \
            --desc

  node-audit:
    name: Worker dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        working-directory: infra
        run: pnpm audit --audit-level moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits rather than just the tree.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads the SARIF results
    strategy:
      fail-fast: false
      matrix:
        # `python` covers agent/, `javascript-typescript` covers infra/.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:${{ matrix.language }}"
