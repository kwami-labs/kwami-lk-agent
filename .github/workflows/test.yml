name: Test

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]

# Least privilege: nothing in this workflow writes to the repository. The
# default for a repo can be read/write for every token, so it is stated here
# rather than inherited.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The offline suite must never reach a provider. Any code path that tries to
  # authenticate fails loudly here instead of silently picking up a real key.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev

      - name: Ruff (lint)
        working-directory: agent
        run: uv run ruff check .

      - name: Ruff (format check)
        working-directory: agent
        run: uv run ruff format --check .

      - name: mypy
        working-directory: agent
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the local floor (.python-version); 3.13 is what the
        # production image builds on (agent/Dockerfile). Both must pass.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run offline suite with coverage
        working-directory: agent
        run: uv run python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: agent/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Catches deploy breakage before `lk agent deploy` does.
      - name: Build agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    name: Cloudflare Worker (types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # packageManager lives in infra/package.json, not the repo root. Without
      # this the action looks at a file that does not exist and exits before
      # any Worker job can run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: infra/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is generated from wrangler.jsonc and is
      # gitignored, so a fresh clone cannot type-check until this runs. It is
      # local codegen -- no Cloudflare credentials involved.
      - name: Generate worker types
        working-directory: infra
        run: pnpm types

      - name: TypeScript
        working-directory: infra
        run: pnpm typecheck

      # Runs inside workerd via @cloudflare/vitest-plugin, so the container
      # binding, the Durable Object and ctx.waitUntil are the real ones. This
      # deploy target had no tests at all while the agent sat at 100%.
      - name: Worker tests
        working-directory: infra
        run: pnpm test
