name: Test

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The offline suite must never reach a provider. Any code path that tries to
  # authenticate fails loudly here instead of silently picking up a real key.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev

      - name: Ruff (lint)
        working-directory: agent
        run: uv run ruff check .

      - name: Ruff (format check)
        working-directory: agent
        run: uv run ruff format --check .

      - name: mypy
        working-directory: agent
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the local floor (.python-version); 3.13 is what the
        # production image builds on (agent/Dockerfile). Both must pass.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        working-directory: agent
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run offline suite with coverage
        working-directory: agent
        run: uv run python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: agent/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Catches deploy breakage before `lk agent deploy` does.
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    name: Cloudflare Worker (types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is generated from wrangler.jsonc and is
      # gitignored, so a fresh clone cannot type-check until this runs. It is
      # local codegen -- no Cloudflare credentials involved.
      - name: Generate worker types
        working-directory: infra
        run: pnpm types

      - name: TypeScript
        working-directory: infra
        run: pnpm typecheck
